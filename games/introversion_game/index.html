<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Reliquias | Abyss 40 · Evaluación Psicométrica</title>
  
  <!-- Tipografía Moderna y Ultra-Legible: Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone con CDNs de alta disponibilidad -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
@import 'tailwindcss';

@property --drone-x {
  syntax: '<percentage>';
  inherits: true;
  initial-value: 35%;
}

@property --drone-y {
  syntax: '<percentage>';
  inherits: true;
  initial-value: 42%;
}

@layer base {
  :root {
    color: #eafcff;
    background: #071827;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background: #071827;
  }

  button {
    font: inherit;
  }
}

.app-shell {
  --cyan: #e8f3fb;
  --yellow: #ffffff;
  --ink: #071421;
  --panel: #10263a;
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  background: #f7fafc;
  color: #18324a;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.topbar {
  z-index: 20;
  display: grid;
  min-height: 88px;
  grid-template-columns: 300px 1fr 300px;
  align-items: center;
  border-bottom: 1px solid #dce7ef;
  background: rgba(255, 255, 255, 0.98);
  box-shadow: 0 5px 22px rgba(24, 67, 97, 0.08);
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  padding-left: 25px;
}

.brand-mark {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid #268dc8;
  transform: rotate(45deg);
}

.brand-mark span {
  width: 15px;
  height: 15px;
  border: 4px solid #268dc8;
}

.eyebrow, .brand-title, .mission-rail p, .telemetry p {
  margin: 0;
}

.eyebrow {
  color: #67878d;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.2em;
}

.brand-title {
  font-size: 26.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.brand-title span {
  color: #258cc7;
}

.timer {
  position: relative;
  display: flex;
  width: 280px;
  height: 54px;
  align-items: center;
  justify-self: center;
  border: 1px solid #c9dce8;
  background: #f5f9fc;
  box-shadow: inset 0 0 25px rgba(42, 143, 199, 0.03);
}

.timer::before, .timer::after {
  position: absolute;
  width: 8px;
  height: 8px;
  content: '';
}

.timer::before {
  top: -1px;
  left: -1px;
  border-top: 2px solid #258cc7;
  border-left: 2px solid #258cc7;
}

.timer::after {
  right: -1px;
  bottom: -1px;
  border-right: 2px solid #258cc7;
  border-bottom: 2px solid #258cc7;
}

.timer-icon {
  width: 16px;
  height: 16px;
  margin: 0 15px;
  border: 2px solid #258cc7;
  border-radius: 50%;
}

.timer-icon::before {
  display: block;
  width: 5px;
  height: 4px;
  margin: -6px auto 0;
  border: 2px solid #258cc7;
  content: '';
}

.timer span, .score-card span {
  display: block;
  color: #6f979b;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.18em;
}

.timer strong {
  display: block;
  color: #197db7;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 26.5px;
  font-weight: 500;
  line-height: 1;
}

.timer-warning strong {
  color: #ff6f6f;
}

.battery {
  position: absolute;
  right: 13px;
  bottom: 9px;
  width: 65px;
  height: 3px;
  background: #d9e6ed;
}

.battery i {
  display: block;
  height: 100%;
  background: #2fa2d5;
  transition: width 1s linear;
}

.score-card {
  padding-right: 26px;
  text-align: right;
}

.score-card strong {
  color: #197db7;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 26.5px;
  font-weight: 500;
}

.score-card small {
  margin-left: 6px;
  color: #6d8b8e;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
}

.game-layout {
  display: grid;
  min-height: calc(100vh - 120px);
  flex: 1;
  grid-template-columns: 250px 1fr;
}

.mission-rail {
  z-index: 10;
  background: #ffffff;
}

.mission-rail {
  padding: 28px 19px;
  border-right: 1px solid #dce7ef;
}

.rail-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 22px;
  border-bottom: 1px solid #e2ebf1;
}

.rail-heading > span {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 1px solid #258cc7;
  color: #258cc7;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 14.5px;
}

.rail-heading p {
  color: #58777c;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.13em;
}

.rail-heading strong {
  color: #18324a;
  font-size: 16.5px;
  letter-spacing: 0.12em;
}

.mission-copy {
  padding: 24px 4px;
  color: #7c999d;
  font-size: 20.5px;
  line-height: 1.2;
}

.mission-copy b {
  color: #18324a;
  font-size: 26.5px;
  font-weight: 600;
}

.route-card {
  position: relative;
  display: flex;
  gap: 11px;
  margin-bottom: 12px;
  padding: 14px 10px;
  overflow: hidden;
  border: 1px solid #dce8ef;
  background: #f5f9fc;
}

.route-card::after {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 32px;
  height: 2px;
  background: #2c9bd0;
  content: '';
}

.cave-route::after {
  background: #6690ae;
}

.route-number {
  display: grid;
  width: 23px;
  height: 23px;
  flex: 0 0 23px;
  place-items: center;
  border: 1px solid #2c9bd0;
  color: #2c9bd0;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 12.5px;
}

.cave-route .route-number {
  border-color: #6690ae;
  color: #527a98;
}

.route-card span {
  color: #258cc7;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 13.5px;
  letter-spacing: 0.12em;
}

.cave-route span {
  color: #527a98;
}

.route-card strong {
  color: #18324a;
  display: block;
  margin: 2px 0;
  font-size: 14.5px;
  font-weight: 600;
}

.route-card p {
  color: #5d7e82;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
  line-height: 1.5;
}

.controls-hint {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 28px;
  padding: 12px 9px;
  border-top: 1px solid #e2ebf1;
  border-bottom: 1px solid #e2ebf1;
}

.controls-hint p {
  color: #668488;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 11.5px;
  line-height: 1.5;
}

.controls-hint b {
  color: #bad0d2;
}

.mouse-icon {
  width: 18px;
  height: 25px;
  border: 1px solid #6b8f91;
  border-radius: 9px;
}

.mouse-icon i {
  display: block;
  width: 2px;
  height: 5px;
  margin: 4px auto;
  background: #258cc7;
}

.game-board {
  position: relative;
  min-height: 620px;
  cursor: crosshair;
  overflow: hidden;
  background: #0c91cf;
  box-shadow: inset 0 0 0 1px rgba(4, 80, 125, 0.14);
  transition: --drone-x .55s cubic-bezier(.2,.8,.2,1), --drone-y .55s cubic-bezier(.2,.8,.2,1);
}

.game-board.phase-briefing,
.game-board.phase-instructions {
  background:
    radial-gradient(circle at 50% 40%, rgba(129, 195, 224, .14), transparent 35%),
    linear-gradient(145deg, #eef7fb, #dcecf4);
}

.game-board.phase-briefing .reef-zone,
.game-board.phase-briefing .cave-zone,
.game-board.phase-briefing .water-rays,
.game-board.phase-briefing .fish-school,
.game-board.phase-briefing .seabed,
.game-board.phase-briefing .drone,
.game-board.phase-instructions .reef-zone,
.game-board.phase-instructions .cave-zone,
.game-board.phase-instructions .water-rays,
.game-board.phase-instructions .fish-school,
.game-board.phase-instructions .seabed,
.game-board.phase-instructions .drone {
  opacity: 0;
  pointer-events: none;
}

.reef-zone, .cave-zone {
  position: absolute;
  inset: 0;
  transition: opacity .35s ease;
}

.reef-zone {
  right: 47%;
  background:
    radial-gradient(circle at 35% 28%, rgba(215, 250, 255, 0.35), transparent 32%),
    linear-gradient(180deg, #22cbe0 0%, #099ed3 48%, #0879ba 100%);
}

.water-rays {
  position: absolute;
  z-index: 1;
  top: -20%;
  left: 0;
  width: 74%;
  height: 95%;
  opacity: 0.42;
  background: repeating-linear-gradient(105deg, transparent 0 60px, rgba(235, 255, 255, 0.34) 62px 110px, transparent 112px 170px);
  filter: blur(10px);
}

.cave-zone {
  left: 51%;
  background:
    radial-gradient(circle at 75% 50%, rgba(118, 211, 243, 0.16), transparent 24%),
    linear-gradient(90deg, #0878ac, #07547f 38%, #083454 82%);
}

.game-board.zone-reef .reef-zone {
  right: 0;
}

.game-board.zone-reef .cave-zone,
.game-board.zone-cave .reef-zone {
  opacity: 0;
  pointer-events: none;
}

.game-board.zone-cave .cave-zone {
  left: 0;
}

.game-board.zone-reef .seabed {
  right: 0;
}

.game-board.zone-cave .seabed {
  opacity: 0;
}

.cave-wall {
  position: absolute;
  z-index: 2;
  left: 0;
  width: 100%;
  height: 34%;
  background:
    radial-gradient(ellipse at 20% 90%, #244f6e 0 14%, transparent 15%),
    radial-gradient(ellipse at 50% 85%, #193e5d 0 17%, transparent 18%),
    radial-gradient(ellipse at 80% 90%, #112e49 0 20%, transparent 21%),
    linear-gradient(#173b58, #0d2a44);
}

.cave-top {
  top: 0;
  clip-path: polygon(0 0, 100% 0, 100% 66%, 80% 74%, 63% 62%, 45% 80%, 27% 64%, 0 76%);
}

.cave-bottom {
  bottom: 0;
  transform: rotate(180deg);
  clip-path: polygon(0 0, 100% 0, 100% 63%, 80% 76%, 61% 68%, 41% 83%, 22% 64%, 0 74%);
}

.zone-label {
  position: absolute;
  z-index: 4;
  top: 18px;
  padding-left: 13px;
  border-left: 2px solid var(--cyan);
}

.zone-label span {
  display: block;
  color: var(--cyan);
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 13.5px;
  letter-spacing: 0.2em;
}

.zone-label strong {
  font-size: 15.5px;
  letter-spacing: 0.12em;
}

.reef-label {
  left: 20px;
}

.cave-label {
  right: 21px;
  border-color: #ffffff;
  text-align: right;
}

.cave-label span {
  color: #ffffff;
}

.cave-label strong {
  color: #ffffff;
}

.deep-glow {
  position: absolute;
  z-index: 1;
  top: 38%;
  right: 8%;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(210, 232, 248, 0.1);
  box-shadow: 0 0 70px 30px rgba(146, 190, 226, 0.1);
}

.cave-details {
  position: absolute;
  z-index: 3;
  inset: 0;
  pointer-events: none;
}

.deep-plant {
  position: absolute;
  bottom: 20%;
  display: flex;
  align-items: flex-end;
  gap: 3px;
}

.deep-plant-one {
  left: 21%;
}

.deep-plant-two {
  right: 26%;
  bottom: 18%;
  transform: scale(.72);
}

.deep-plant i {
  display: block;
  width: 8px;
  height: 52px;
  border-radius: 100% 0;
  background: #37b27d;
  box-shadow: inset -2px 0 rgba(7, 75, 72, .26);
  transform: rotate(-12deg);
}

.deep-plant i:nth-child(2) {
  height: 38px;
  background: #65c996;
  transform: rotate(8deg);
}

.deep-plant i:nth-child(3) {
  height: 45px;
  background: #2b9c75;
  transform: rotate(18deg);
}

.cave-crystal {
  position: absolute;
  bottom: 18%;
  display: flex;
  align-items: flex-end;
  filter: drop-shadow(0 0 8px rgba(98, 220, 255, .4));
}

.crystal-one {
  right: 11%;
}

.crystal-two {
  left: 43%;
  bottom: 22%;
  transform: scale(.58);
}

.cave-crystal i {
  display: block;
  width: 13px;
  height: 42px;
  margin: 0 -2px;
  background: linear-gradient(90deg, #76e6f3, #c8f9ff 55%, #438dc8);
  clip-path: polygon(50% 0, 100% 22%, 82% 100%, 14% 100%, 0 25%);
  transform: rotate(-8deg);
}

.cave-crystal i:nth-child(2) {
  height: 57px;
  transform: rotate(4deg);
}

.cave-crystal i:nth-child(3) {
  height: 34px;
  transform: rotate(13deg);
}

.cave-rock {
  position: absolute;
  bottom: 17%;
  width: 58px;
  height: 28px;
  border-radius: 55% 45% 10% 12%;
  background: linear-gradient(145deg, #38647e, #173a55);
  box-shadow: inset 8px 5px rgba(132, 181, 207, .13);
}

.rock-one {
  left: 5%;
}

.rock-two {
  right: 38%;
  bottom: 15%;
  transform: scale(.7);
}

.cave-bubbles {
  position: absolute;
  top: 36%;
  left: 38%;
}

.cave-bubbles i {
  position: absolute;
  width: 8px;
  height: 8px;
  border: 1px solid rgba(220, 248, 255, .7);
  border-radius: 50%;
  animation: deep-bubble 4.5s ease-in infinite;
}

.cave-bubbles i:nth-child(2) { left: 14px; top: 18px; width: 5px; height: 5px; animation-delay: 1s; }
.cave-bubbles i:nth-child(3) { left: -7px; top: 35px; width: 11px; height: 11px; animation-delay: 2s; }
.cave-bubbles i:nth-child(4) { left: 10px; top: 52px; width: 4px; height: 4px; animation-delay: 3s; }

@keyframes deep-bubble {
  0% { opacity: 0; translate: 0 30px; }
  25% { opacity: .8; }
  100% { opacity: 0; translate: 8px -70px; }
}

.fish-school {
  position: absolute;
  z-index: 3;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.fish {
  position: absolute;
  width: 25px;
  height: 12px;
  border-radius: 60% 45% 45% 60%;
  background: #f5a629;
  box-shadow: inset 0 -3px rgba(183, 91, 13, 0.28);
  animation: swim-left 16s linear infinite;
}

.fish::before {
  position: absolute;
  top: 2px;
  right: -8px;
  width: 10px;
  height: 10px;
  background: #e99520;
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
  content: '';
}

.fish::after {
  position: absolute;
  top: 3px;
  left: 4px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #203647;
  content: '';
}

.fish i {
  position: absolute;
  top: 8px;
  left: 10px;
  width: 8px;
  height: 6px;
  background: #ffc85a;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

.fish-one { top: 15%; left: 92%; animation-duration: 18s; }
.fish-two { top: 28%; left: 76%; animation-delay: -7s; animation-duration: 14s; transform: scale(.72); }
.fish-three { top: 43%; left: 96%; animation-delay: -2s; animation-duration: 20s; transform: scale(.9); }
.fish-four { top: 63%; left: 87%; animation-delay: -11s; animation-duration: 17s; transform: scale(.58); }
.fish-five { top: 73%; left: 78%; animation-delay: -4s; animation-duration: 13s; transform: scale(.7); }
.fish-six { top: 33%; left: 58%; animation-delay: -13s; animation-duration: 21s; transform: scale(.52); opacity: .75; }
.fish-seven { top: 81%; left: 95%; animation-delay: -8s; animation-duration: 23s; transform: scale(.46); opacity: .62; }
.fish-eight { top: 52%; left: 67%; animation-delay: -16s; animation-duration: 19s; transform: scale(.42); opacity: .55; }

@keyframes swim-left {
  from { translate: 8vw 0; }
  45% { translate: -55vw 12px; }
  100% { translate: -110vw -8px; }
}

.gem {
  position: absolute;
  z-index: 5;
  width: 32px;
  height: 38px;
  padding: 0;
  border: 0;
  cursor: pointer;
  background: transparent;
  filter: drop-shadow(0 0 7px rgba(255,255,255,.6));
  transform: translate(-50%, -50%);
  transition: transform .2s, opacity .2s;
}

.gem:hover {
  transform: translate(-50%, -50%) scale(1.28);
}

.gem svg {
  width: 100%;
  height: 100%;
}

.gem span {
  position: absolute;
  top: -9px;
  left: 26px;
  padding: 1px 4px;
  color: white;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 13.5px;
  background: rgba(4, 26, 31, 0.72);
}

.gem-shape {
  stroke: rgba(255,255,255,.8);
  stroke-width: 1.5;
}

.gem-cyan { fill: #f4fbff; }
.gem-pink { fill: #d8e7f2; }
.gem-lime { fill: #bcd3e5; }
.gem-gold { fill: #ffffff; }
.gem-shine { fill: none; stroke: rgba(255,255,255,.65); stroke-width: 1; }
.gem.collected { pointer-events: none; opacity: 0; transform: translate(-50%, -80%) scale(.4); }

.cave-reward {
  z-index: 7;
  width: 27px;
  height: 32px;
  filter: drop-shadow(0 0 9px rgba(170, 238, 255, .72));
}

.cave-reward .gem-shape {
  fill: #c9f7ff;
  stroke: #ffffff;
}

.cave-reward span {
  color: #e9fbff;
  background: rgba(5, 43, 70, .78);
}

.coral, .seaweed {
  position: absolute;
  z-index: 3;
  bottom: 3%;
}

.coral-a { left: 7%; }
.coral-b { left: 38%; transform: scale(.8); }

.coral i {
  display: inline-block;
  width: 12px;
  height: 72px;
  margin: 0 -2px;
  border-radius: 10px 10px 0 0;
  background: #ff6f83;
  transform: rotate(-15deg);
  box-shadow: inset -4px 0 rgba(119, 31, 78, .3);
}

.coral i:nth-child(2) { height: 48px; background: #ff9a4d; transform: rotate(8deg); }
.coral i:nth-child(3) { height: 61px; background: #e657a5; transform: rotate(22deg); }

.seaweed-a { left: 25%; }
.seaweed-b { left: 47%; }

.seaweed i {
  display: inline-block;
  width: 8px;
  height: 90px;
  margin: 0 3px;
  border-radius: 100% 0;
  background: #3fcf78;
  transform: rotate(-7deg);
}

.seaweed i:nth-child(2) { height: 60px; transform: rotate(11deg); background: #86df55; }
.seaweed i:nth-child(3) { height: 75px; transform: rotate(20deg); }

.bubble {
  position: absolute;
  z-index: 2;
  width: 8px;
  height: 8px;
  border: 1px solid rgba(192, 255, 249, .7);
  border-radius: 50%;
  animation: bubble 4s infinite ease-in;
}

.bubble-one { left: 12%; bottom: 20%; }
.bubble-two { left: 32%; bottom: 35%; animation-delay: 1.2s; transform: scale(.7); }
.bubble-three { left: 45%; bottom: 15%; animation-delay: 2.2s; transform: scale(1.4); }

@keyframes bubble {
  0% { opacity: 0; translate: 0 0; }
  30% { opacity: 1; }
  100% { opacity: 0; translate: 10px -180px; }
}

.seabed {
  position: absolute;
  z-index: 2;
  right: 47%;
  bottom: -25px;
  left: 0;
  height: 85px;
  background: #155481;
  clip-path: polygon(0 35%, 13% 19%, 27% 40%, 41% 12%, 58% 37%, 72% 20%, 86% 36%, 100% 13%, 100% 100%, 0 100%);
  box-shadow: inset 0 20px 30px rgba(12, 38, 47, .25);
}

.cave-darkness {
  position: absolute;
  z-index: 10;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(

}

.manual-steps strong {
  display: block;

  font-size: 13.5px;

}

.start-button {
  display: flex;
  width: 245px;
  height: 47px;

  padding: 0 6px 0 20px;
  border: 1px solid #1688c2;

  background: #1688c2;

  box-shadow: 0 8px 22px rgba(2, 12, 22, .2);

}
.start-button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(2, 12, 22, .32); }
.start-button:disabled {
  border-color: #b9c9d2;

  cursor: not-allowed;
  background: #dce5ea;
  box-shadow: none;
}
.start-button:disabled:hover { transform: none; box-shadow: none; }
.start-button i { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(6, 34, 38, .35); font-family: sans-serif; font-style: normal; font-size: 19.5px; }
.briefing-card > small { display: block; margin-top: 11px; color: #4f6c70; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 13.5px; }

.result-stats {
  display: grid;

}

.result-stats div { padding: 12px; background: #f5f9fc; }
.result-stats span { display: block; color: #658488; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 13.5px; }
.result-stats b { color: #197db7; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 19.5px; }

.telemetry {
  padding: 23px 17px;

}

.telemetry-title {

}

.live-dot {

}

.telemetry-title p { font-size: 15.5px; font-weight: 700; letter-spacing: .15em; }
.telemetry-title small { margin-left: auto; color: #258cc7; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 9.5px; letter-spacing: .1em; }

.metric {
  padding: 20px 0;
  border-bottom: 1px solid #e2ebf1;

.metric-top {

}

.metric-top span {
  color: #78979a;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 13.5px;
  letter-spacing: .1em;
}

.metric-top b { color: #197db7; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 19.5px; font-weight: 500; }
.metric > small { display: block; margin-top: 6px; color: #425f64; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 9.5px; letter-spacing: .1em; }

.metric-bar { height: 5px; margin-top: 9px; background: #dce8ef; }
.metric-bar i { display: block; height: 100%; background: #2b98ca; box-shadow: none; transition: width .3s; }
.waveform { display: flex; height: 36px; align-items: center; gap: 3px; margin-top: 7px; }
.waveform i { width: 5px; background: #dceaf3; opacity: .72; transition: height .4s; }

.stability-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 3px;
  margin-top: 10px;
}

.stability-grid i { height: 5px; background: #17383e; }
.stability-grid i.active { background: #eef6fb; box-shadow: 0 0 5px rgba(238, 246, 251, .5); }

.profile-scale { margin-top: 22px; }
.scale-labels, .scale-numbers { display: flex; justify-content: space-between; color: #638186; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 9.5px; }
.scale-track { position: relative; height: 3px; margin: 10px 4px 5px; background: linear-gradient(90deg, #69859b, #f4f8fb); }
.scale-track i { position: absolute; top: -5px; width: 3px; height: 13px; background: white; box-shadow: 0 0 6px white; transition: left .4s; }
.profile-scale p { margin-top: 9px; color: #425f64; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 9.5px; text-align: center; letter-spacing: .1em; }

.system-note {
  display: flex;
  gap: 8px;
  margin-top: 28px;
  padding: 10px;
  border: 1px solid #dce8ef;
  background: #f5f9fc;
}

.system-note span { color: var(--cyan); font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 13.5px; }
.system-note p { color: #547176; font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 13.5px; line-height: 1.5; }

footer {
  z-index: 20;
  display: flex;
  height: 32px;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-top: 1px solid #dce7ef;
  color: #3f6065;
  background: #ffffff;
  font-family: 'JetBrains Mono', 'DM Mono', monospace;
  font-size: 13.5px;
  letter-spacing: .12em;
}

footer div { color: #618184; }
footer i { display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%; background: #52df9a; box-shadow: 0 0 5px #52df9a; }

.app-shell,
.app-shell * {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

@media (max-width: 1100px) {
  .game-layout { grid-template-columns: 190px minmax(500px, 1fr); }
  .telemetry { display: none; }
  .topbar { grid-template-columns: 230px 1fr 210px; }
}

@media (max-width: 760px) {
  .topbar { min-height: 72px; grid-template-columns: 1fr 1fr; }
  .brand { padding-left: 16px; }
  .brand .eyebrow { display: none; }
  .brand-mark { width: 29px; height: 29px; }
  .timer { width: 150px; height: 44px; margin-right: 10px; justify-self: end; }
  .timer-icon, .battery { display: none; }
  .score-card { position: absolute; top: 78px; right: 11px; z-index: 30; padding: 6px 9px; background: rgba(4, 25, 30, .8); }
  .game-layout { display: block; min-height: calc(100vh - 104px); }
  .mission-rail { display: none; }
  .game-board { min-height: calc(100vh - 104px); }
  .briefing-card { padding: 30px 20px 25px; }
  .briefing-card h1 { font-size: 36px; }
  .instructions-overlay { align-items: start; padding: 14px; }
  .instructions-card { padding: 20px 16px; }
  .instructions-header h1 { font-size: 31px; }
  .mission-duration { min-width: 82px; padding: 9px; }
  .instructions-grid { grid-template-columns: 1fr; }
  .instruction-block { min-height: 88px; }
  .chest-instruction { grid-template-columns: 38px 1fr; }
  .hold-indicator { display: none; }
  .chest-manual-icon { width: 36px; height: 36px; }
  .instructions-footer { flex-direction: column; align-items: stretch; }
  .instructions-footer .start-button { width: 100%; }
  .zone-selector { grid-template-columns: 1fr; }
  .zone-option { min-height: 72px; }
  .cave-entry { right: 50%; min-width: 200px; transform: translateX(50%); }
  .cave-entry:hover { transform: translateX(50%) translateY(-3px); }
  .reef-return { top: 18%; right: auto; left: 10px; min-width: 190px; transform: none; }
  .reef-return:hover { transform: translateY(-3px); }
  .manual-steps { grid-template-columns: 1fr; }
  .manual-steps > div { min-height: 55px; }
  .manual-steps > div + div { border-top: 1px solid #d8e6ee; border-left: 0; }
  .zone-label strong { font-size: 14.5px; }
  .reef-zone { right: 45%; }
  .cave-zone { left: 53%; }
  footer span, footer p { display: none; }
  footer { justify-content: center; }
}

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

const { useEffect, useMemo, useRef, useState } = React;

const gems = [
  { x: 7, y: 19, value: 10, color: 'cyan' },
  { x: 18, y: 33, value: 15, color: 'pink' },
  { x: 29, y: 14, value: 10, color: 'lime' },
  { x: 42, y: 27, value: 25, color: 'gold' },
  { x: 56, y: 17, value: 10, color: 'pink' },
  { x: 69, y: 34, value: 20, color: 'cyan' },
  { x: 84, y: 19, value: 15, color: 'lime' },
  { x: 94, y: 39, value: 25, color: 'gold' },
  { x: 11, y: 67, value: 10, color: 'pink' },
  { x: 27, y: 54, value: 15, color: 'cyan' },
  { x: 44, y: 73, value: 10, color: 'lime' },
  { x: 61, y: 59, value: 20, color: 'gold' },
  { x: 77, y: 72, value: 15, color: 'pink' },
  { x: 91, y: 61, value: 20, color: 'cyan' },
];

const caveRewards = [
  { x: 10, y: 45, value: 20 },
  { x: 25, y: 61, value: 25 },
  { x: 41, y: 42, value: 20 },
  { x: 57, y: 65, value: 30 },
  { x: 71, y: 39, value: 25 },
  { x: 91, y: 68, value: 20 },
];

function DroneIcon() {
  return (
    <svg viewBox="0 0 90 60" aria-hidden="true">
      <path className="drone-beam" d="M27 40 4 57h49Z" />
      <path className="drone-arm" d="M17 28H5m68 0h12" />
      <circle className="drone-prop" cx="8" cy="22" r="7" />
      <circle className="drone-prop" cx="82" cy="22" r="7" />
      <path className="drone-body" d="M24 16h42l8 13-12 16H28L16 29Z" />
      <path className="drone-top" d="M35 9h20l5 8H30Z" />
      <circle className="drone-eye" cx="56" cy="29" r="7" />
      <circle className="drone-glint" cx="58" cy="27" r="2" />
      <path className="drone-claw" d="M36 44v7l-6 4m24-11v7l6 4" />
    </svg>
  );
}

function GemIcon({ color }) {
  return (
    <svg viewBox="0 0 42 48" aria-hidden="true">
      <path className={`gem-shape gem-${color}`} d="m21 2 17 13-6 25-11 6-11-6-6-25Z" />
      <path className="gem-shine" d="M21 2v38M4 15h34L21 40 4 15 21 2l17 13" />
    </svg>
  );
}

function App({ onComplete }) {
  const [phase, setPhase] = useState('instructions');
  const [selectedZone, setSelectedZone] = useState(null);
  const [seconds, setSeconds] = useState(40);
  const [score, setScore] = useState(0);
  const [position, setPosition] = useState({ x: 35, y: 42 });
  const [collected, setCollected] = useState([]);
  const [caveCollected, setCaveCollected] = useState([]);
  
  // Telemetría
  const [frecuenciaMotriz, setFrecuenciaMotriz] = useState(0);
  const [visitedCells, setVisitedCells] = useState(new Set(['3-4']));
  const [estabilidadSostenida, setEstabilidadSostenida] = useState(0);
  const currentStillSecondsRef = useRef(0);
  const maxStillSecondsRef = useRef(0);

  const [chestFocus, setChestFocus] = useState(0);
  const [chestOpen, setChestOpen] = useState(false);
  const [transitionTarget, setTransitionTarget] = useState(null);
  const boardRef = useRef(null);

  const areaExploradaDecimal = useMemo(() => {
    return Math.min(1.0, visitedCells.size / 100.0);
  }, [visitedCells]);

  const calculatedExtroversion = useMemo(() => {
    const rawScore = 5.0 + (frecuenciaMotriz * 0.08) + (areaExploradaDecimal * 3.0) - (estabilidadSostenida * 0.35);
    const clamped = Math.max(0, Math.min(10, rawScore));
    return Number(clamped.toFixed(2));
  }, [frecuenciaMotriz, areaExploradaDecimal, estabilidadSostenida]);

  // Batería 40 segundos
  useEffect(() => {
    if (phase !== 'playing' || transitionTarget) return;

    const timer = window.setInterval(() => {
      currentStillSecondsRef.current += 1;
      if (currentStillSecondsRef.current > maxStillSecondsRef.current) {
        maxStillSecondsRef.current = currentStillSecondsRef.current;
        setEstabilidadSostenida(maxStillSecondsRef.current);
      }

      setSeconds((value) => {
        if (value <= 1) {
          setPhase('done');
          return 0;
        }
        return value - 1;
      });
    }, 1000);

    return () => window.clearInterval(timer);
  }, [phase, transitionTarget]);

  // Transiciones
  useEffect(() => {
    if (!transitionTarget) return;
    const transitionTimer = window.setTimeout(() => {
      setSelectedZone(transitionTarget);
      setPosition(transitionTarget === 'cave' ? { x: 12, y: 50 } : { x: 88, y: 48 });
      setTransitionTarget(null);
    }, 1400);
    return () => window.clearTimeout(transitionTimer);
  }, [transitionTarget]);

  // Cofre (8 segundos)
  useEffect(() => {
    if (phase !== 'playing' || chestFocus <= 0 || chestFocus >= 8) return;

    const focusTimer = window.setTimeout(() => {
      setChestFocus((value) => {
        const next = value + 1;
        if (next === 8) {
          setChestOpen(true);
          setScore((current) => current + 500);
        }
        return next;
      });
    }, 1000);

    return () => window.clearTimeout(focusTimer);
  }, [chestFocus, phase]);

  useEffect(() => {
    if (phase === 'done' && onComplete) {
      onComplete({
        game_id: 'buscador_de_reliquias',
        frecuenciaMotriz,
        areaExplorada: Number(areaExploradaDecimal.toFixed(3)),
        estabilidadSostenida,
        puntajeFinal: calculatedExtroversion,
        dimension: calculatedExtroversion >= 5.0 ? 'E' : 'I'
      });
    }
  }, [phase, onComplete, frecuenciaMotriz, areaExploradaDecimal, estabilidadSostenida, calculatedExtroversion]);

  function recordMotorAction() {
    setFrecuenciaMotriz((prev) => prev + 1);
    currentStillSecondsRef.current = 0;
    if (!chestOpen) {
      setChestFocus(0);
    }
  }

  function trackGridCell(xPct, yPct) {
    const gridX = Math.max(0, Math.min(9, Math.floor(xPct / 10)));
    const gridY = Math.max(0, Math.min(9, Math.floor(yPct / 10)));
    const cellKey = `${gridX}-${gridY}`;

    setVisitedCells((current) => {
      if (current.has(cellKey)) return current;
      const next = new Set(current);
      next.add(cellKey);
      return next;
    });
  }

  function startGame() {
    if (!selectedZone) return;
    setSeconds(40);
    setScore(0);
    setPosition({ x: 35, y: 42 });
    setCollected([]);
    setCaveCollected([]);
    setFrecuenciaMotriz(0);
    setVisitedCells(new Set(['3-4']));
    setEstabilidadSostenida(0);
    currentStillSecondsRef.current = 0;
    maxStillSecondsRef.current = 0;
    setChestFocus(0);
    setChestOpen(false);
    setTransitionTarget(null);
    setPhase('playing');
  }

  function openZoneSelection() {
    setSelectedZone(null);
    setPhase('choosing');
  }

  function chooseAgain() {
    setSelectedZone(null);
    setPhase('choosing');
  }

  function moveDrone(event) {
    if (phase !== 'playing' || !boardRef.current) return;
    const target = event.target;
    if (target.closest && (target.closest('[data-gem]') || target.closest('[data-cave-reward]') || target.closest('[data-chest]'))) return;

    const rect = boardRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100));

    recordMotorAction();
    setPosition({ x, y });
    trackGridCell(x, y);
  }

  function collectGem(index) {
    if (phase !== 'playing' || collected.includes(index)) return;
    const gem = gems[index];

    recordMotorAction();
    setPosition({ x: gem.x, y: gem.y });
    trackGridCell(gem.x, gem.y);

    setCollected((current) => [...current, index]);
    setScore((value) => value + gem.value);
  }

  function collectCaveReward(index) {
    if (phase !== 'playing' || caveCollected.includes(index)) return;
    const reward = caveRewards[index];

    recordMotorAction();
    setPosition({ x: reward.x, y: reward.y });
    trackGridCell(reward.x, reward.y);

    setCaveCollected((current) => [...current, index]);
    setScore((value) => value + reward.value);
  }

  function focusChest() {
    if (phase !== 'playing' || chestOpen) return;
    recordMotorAction();
    setPosition({ x: 86, y: 51 });
    trackGridCell(86, 51);
    setChestFocus(1);
  }

  function enterDeepCave() {
    if (phase !== 'playing' || selectedZone !== 'reef' || transitionTarget) return;
    recordMotorAction();
    setPosition({ x: 86, y: 86 });
    trackGridCell(86, 86);
    setTransitionTarget('cave');
  }

  function returnToReef() {
    if (phase !== 'playing' || selectedZone !== 'cave' || transitionTarget) return;
    recordMotorAction();
    setPosition({ x: 8, y: 32 });
    trackGridCell(8, 32);
    setTransitionTarget('reef');
  }

  const explorationPct = Math.round(areaExploradaDecimal * 100);
  const actionsPerSecond = phase === 'briefing' ? 0 : frecuenciaMotriz / Math.max(1, 40 - seconds);

  return (
    <main className="app-shell">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">
            <span />
          </div>
          <div>
            <p className="eyebrow">PROTOCOLO DE EVALUACIÓN PSICOMÉTRICA</p>
            <p className="brand-title">BUSCADOR<span>/</span>RELIQUIAS</p>
          </div>
        </div>

        <div className={`timer ${seconds <= 10 ? 'timer-warning' : ''}`}>
          <div className="timer-icon" />
          <div>
            <span>BATERÍA</span>
            <strong>00:{String(seconds).padStart(2, '0')}</strong>
          </div>
          <div className="battery">
            <i style={{ width: `${(seconds / 40) * 100}%` }} />
          </div>
        </div>

        <div className="score-card">
          <span>VALOR RECUPERADO</span>
          <strong>{score.toString().padStart(4, '0')}</strong>
          <small>CRÉDITOS</small>
        </div>
      </header>

      <section className="game-layout">
        <div className="mission-rail">
          <div className="rail-heading">
            <span>01</span>
            <div>
              <p>DILEMA CONDUCTUAL</p>
              <strong>DOS RUTAS</strong>
            </div>
          </div>

          <div className="mission-copy">
            <p>Dos rutas.</p>
            <p>40 segundos de batería.</p>
            <b>Tu estrategia de exploración.</b>
          </div>

          <div className="route-card reef-route">
            <div className="route-number">A</div>
            <div>
              <span>ARRECIFE SUPERFICIAL</span>
              <strong>Explora y recolecta</strong>
              <p>Recompensas frecuentes · Movilidad continua</p>
            </div>
          </div>
          <div className="route-card cave-route">
            <div className="route-number">B</div>
            <div>
              <span>CUEVA PROFUNDA</span>
              <strong>Cofre Central</strong>
              <p>Recompensa masiva (+500) · 8s concentración</p>
            </div>
          </div>

          <div className="controls-hint">
            <span className="mouse-icon"><i /></span>
            <p><b>HAZ CLIC</b> en el mapa para dirigir el dron submarino</p>
          </div>
        </div>

        <div
          className={`game-board phase-${phase} ${selectedZone ? `zone-${selectedZone}` : 'zone-split'}`}
          ref={boardRef}
          onPointerDown={moveDrone}
          style={{
            '--drone-x': `${position.x}%`,
            '--drone-y': `${position.y}%`,
          }}
        >
          <div className="water-rays" />
          <div className="fish-school" aria-hidden="true">
            <span className="fish fish-one"><i /></span>
            <span className="fish fish-two"><i /></span>
            <span className="fish fish-three"><i /></span>
            <span className="fish fish-four"><i /></span>
            <span className="fish fish-five"><i /></span>
            <span className="fish fish-six"><i /></span>
            <span className="fish fish-seven"><i /></span>
            <span className="fish fish-eight"><i /></span>
          </div>

          {/* ZONA A: ARRECIFE SUPERFICIAL */}
          <div className="reef-zone">
            <div className="zone-label reef-label">
              <span>RUTA A</span>
              <strong>ARRECIFE SUPERFICIAL</strong>
            </div>
            <div className="bubble bubble-one" />
            <div className="bubble bubble-two" />
            <div className="bubble bubble-three" />
            <div className="coral coral-a"><i /><i /><i /></div>
            <div className="coral coral-b"><i /><i /><i /></div>
            <div className="seaweed seaweed-a"><i /><i /><i /></div>
            <div className="seaweed seaweed-b"><i /><i /></div>
            {gems.map((gem, index) => (
              <button
                className={`gem ${collected.includes(index) ? 'collected' : ''}`}
                data-gem
                key={index}
                onPointerDown={(event) => {
                  event.stopPropagation();
                  collectGem(index);
                }}
                style={{ left: `${gem.x}%`, top: `${gem.y}%` }}
                aria-label={`Recolectar gema de ${gem.value} créditos`}
              >
                <GemIcon color={gem.color} />
                <span>+{gem.value}</span>
              </button>
            ))}
          </div>

          {/* ZONA B: CUEVA PROFUNDA */}
          <div className="cave-zone">
            <div className="cave-wall cave-top" />
            <div className="cave-wall cave-bottom" />
            <div className="zone-label cave-label">
              <span>RUTA B</span>
              <strong>CUEVA PROFUNDA</strong>
            </div>
            <div className="deep-glow" />
            <div className="cave-details" aria-hidden="true">
              <span className="deep-plant deep-plant-one"><i /><i /><i /></span>
              <span className="deep-plant deep-plant-two"><i /><i /></span>
              <span className="cave-crystal crystal-one"><i /><i /><i /></span>
              <span className="cave-crystal crystal-two"><i /><i /></span>
              <span className="cave-rock rock-one" />
              <span className="cave-rock rock-two" />
              <span className="cave-bubbles"><i /><i /><i /><i /></span>
            </div>
            {caveRewards.map((reward, index) => (
              <button
                className={`gem cave-reward ${caveCollected.includes(index) ? 'collected' : ''}`}
                data-cave-reward
                key={index}
                onPointerDown={(event) => {
                  event.stopPropagation();
                  collectCaveReward(index);
                }}
                style={{ left: `${reward.x}%`, top: `${reward.y}%` }}
                aria-label={`Recuperar reliquia de ${reward.value} créditos`}
              >
                <GemIcon color="cyan" />
                <span>+{reward.value}</span>
              </button>
            ))}

            {/* COFRE CENTRAL (8 SEGUNDOS) */}
            <button
              className={`chest ${chestOpen ? 'chest-open' : ''}`}
              data-chest
              onPointerDown={(event) => {
                event.stopPropagation();
                focusChest();
              }}
              aria-label="Mantener posición sobre el cofre durante 8 segundos"
            >
              <span className="chest-lid"><i /></span>
              <span className="chest-body"><i /></span>
              <b>{chestOpen ? 'ABIERTO' : '+500'}</b>
            </button>
            {chestFocus > 0 && !chestOpen && (
              <div className="focus-meter">
                <div className="focus-ring" style={{ '--progress': `${(chestFocus / 8) * 360}deg` }}>
                  <span>{8 - chestFocus}</span>
                </div>
                <p>MANTÉN POSICIÓN (8s)</p>
                <small>Cualquier clic reinicia el cofre</small>
              </div>
            )}
          </div>

          <div className="seabed" />
          {phase === 'playing' && selectedZone === 'cave' && (
            <>
              <div className="cave-darkness" aria-hidden="true" />
              <div className="drone-light-ring" aria-hidden="true">
                <i />
              </div>
            </>
          )}

          {/* Dron submarino */}
          <div className="drone" style={{ left: `${position.x}%`, top: `${position.y}%` }}>
            <DroneIcon />
            <span>DRN-07</span>
          </div>

          {/* Entradas */}
          {phase === 'playing' && selectedZone === 'reef' && (
            <button
              className="cave-entry"
              onPointerDown={(event) => {
                event.stopPropagation();
                enterDeepCave();
              }}
              aria-label="Descender a la cueva profunda"
            >
              <span className="entry-pulse"><i>↓</i></span>
              <span>
                <small>RUTA ALTERNATIVA</small>
                <strong>DESCENDER A LA CUEVA</strong>
                <p>Lleva el dron hasta aquí</p>
              </span>
            </button>
          )}

          {phase === 'playing' && selectedZone === 'cave' && (
            <button
              className="cave-entry reef-return"
              onPointerDown={(event) => {
                event.stopPropagation();
                returnToReef();
              }}
              aria-label="Regresar al arrecife exterior"
            >
              <span className="entry-pulse"><i>↑</i></span>
              <span>
                <small>RUTA DE REGRESO</small>
                <strong>VOLVER AL EXTERIOR</strong>
                <p>Lleva el dron hasta aquí</p>
              </span>
            </button>
          )}

          {transitionTarget && (
            <div className={`dive-transition ${transitionTarget === 'reef' ? 'rise-transition' : ''}`} aria-live="polite">
              <div className="transition-bubbles">
                <i /><i /><i /><i /><i /><i />
              </div>
              <div className="depth-lines"><i /><i /><i /><i /><i /></div>
              <div className="transition-message">
                <span>CAMBIO DE PROFUNDIDAD</span>
                <strong>{transitionTarget === 'cave' ? 'DESCENDIENDO' : 'ASCENDIENDO'}</strong>
                <small>{transitionTarget === 'cave' ? 'CUEVA PROFUNDA · NIVEL −02' : 'ARRECIFE EXTERIOR · NIVEL 00'}</small>
              </div>
            </div>
          )}

          {/* MODAL 1: INSTRUCCIONES */}
          {phase === 'instructions' && (
            <div className="briefing-overlay instructions-overlay">
              <div className="instructions-card">
                <div className="instructions-header">
                  <div>
                    <span className="briefing-index">MANUAL OPERATIVO / DRN-07</span>
                    <p className="briefing-kicker">ANTES DE SUMERGIRTE</p>
                    <h1>INSTRUCCIONES<br /><em>DE LA MISIÓN</em></h1>
                  </div>
                  <div className="mission-duration">
                    <span>BATERÍA TOTAL</span>
                    <strong>40</strong>
                    <small>SEGUNDOS</small>
                  </div>
                </div>

                <div className="instructions-grid">
                  <section className="instruction-block">
                    <span className="instruction-number">01</span>
                    <div className="instruction-icon">⌁</div>
                    <div>
                      <small>CONTROL PRINCIPAL</small>
                      <strong>MUEVE EL DRON</strong>
                      <p>Haz clic en cualquier punto del mapa. El dron se desplazará hacia el objetivo.</p>
                    </div>
                  </section>
                  <section className="instruction-block">
                    <span className="instruction-number">02</span>
                    <div className="instruction-icon">◇</div>
                    <div>
                      <small>ARRECIFE SUPERFICIAL</small>
                      <strong>RECOLECTA GEMAS</strong>
                      <p>Múltiples gemas que desaparecen al contacto. Fomenta desplazamientos ágiles y continuos.</p>
                    </div>
                  </section>
                  <section className="instruction-block">
                    <span className="instruction-number">03</span>
                    <div className="instruction-icon">↕</div>
                    <div>
                      <small>TRANSICIÓN</small>
                      <strong>DOS RUTAS LIBRES</strong>
                      <p>Puedes descender a la cueva o ascender al arrecife en cualquier instante de la partida.</p>
                    </div>
                  </section>
                  <section className="instruction-block">
                    <span className="instruction-number">04</span>
                    <div className="instruction-icon">◉</div>
                    <div>
                      <small>CUEVA PROFUNDA</small>
                      <strong>COFRE CENTRAL</strong>
                      <p>La cueva oculta un único cofre central de alto valor (+500 créditos).</p>
                    </div>
                  </section>
                </div>

                <div className="chest-instruction">
                  <span className="chest-manual-icon">▣</span>
                  <div>
                    <small>OBJETIVO ESPECIAL · +500 CRÉDITOS</small>
                    <strong>¿CÓMO ABRIR EL COFRE?</strong>
                    <p>Ubica el dron sobre el cofre y permanece <b>exactamente 8 segundos inmóvil</b>. Cualquier clic en la pantalla reiniciará el contador a cero.</p>
                  </div>
                  <div className="hold-indicator">
                    <i />
                    <span>8s</span>
                  </div>
                </div>

                <div className="instructions-footer">
                  <p><i /> El cronómetro comenzará al seleccionar tu zona de inmersión.</p>
                  <button className="start-button" onClick={() => setPhase('briefing')}>
                    <span>ENTENDIDO, CONTINUAR</span>
                    <i>→</i>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: BRIEFING PREVIO */}
          {phase === 'briefing' && (
            <div className="briefing-overlay">
              <div className="briefing-card">
                <span className="briefing-index">SIMULACIÓN CONDUCTUAL</span>
                <p className="briefing-kicker">INMERSIÓN LISTA</p>
                <h1>¿CÓMO INVERTIRÁS<br />TUS <em>40 SEGUNDOS?</em></h1>
                <p className="briefing-text">Elige libremente tu ruta inicial. Tu patrón de búsqueda espacial y motriz determinará el rendimiento de la exploración.</p>
                <div className="game-manual">
                  <div className="manual-heading">
                    <span>MANUAL DE INMERSIÓN</span>
                    <small>GUÍA RÁPIDA</small>
                  </div>
                  <div className="manual-steps">
                    <div>
                      <b>01</b>
                      <span className="manual-symbol">⌁</span>
                      <p><strong>MUÉVETE</strong>Haz clic para desplazar el dron por el mapa.</p>
                    </div>
                    <div>
                      <b>02</b>
                      <span className="manual-symbol">◇</span>
                      <p><strong>RECOLECTA</strong>Recoge gemas en el arrecife superficial.</p>
                    </div>
                    <div>
                      <b>03</b>
                      <span className="manual-symbol">▣</span>
                      <p><strong>CONCÉNTRATE</strong>Permanece 8 segundos inmóvil sobre el cofre.</p>
                    </div>
                  </div>
                </div>
                <button className="start-button" onClick={openZoneSelection}>
                  <span>INICIAR JUEGO</span>
                  <i>→</i>
                </button>
                <small>Selecciona tu zona para comenzar los 40 segundos</small>
              </div>
            </div>
          )}

          {/* MODAL 3: SELECCIÓN DE ZONA */}
          {phase === 'choosing' && (
            <div className="briefing-overlay">
              <div className="briefing-card zone-choice-card">
                <span className="briefing-index">SELECCIÓN DE RUTA</span>
                <p className="briefing-kicker">PLAN DE INMERSIÓN</p>
                <h1>ELIGE TU<br /><em>ZONA DE EXPLORACIÓN</em></h1>
                <p className="briefing-text">Define tu estrategia inicial. Puedes transicionar libremente de una zona a otra durante la partida.</p>
                <div className="zone-selector">
                  <button
                    className={`zone-option reef-option ${selectedZone === 'reef' ? 'selected' : ''}`}
                    onClick={() => setSelectedZone('reef')}
                  >
                    <span className="option-letter">A</span>
                    <span>
                      <small>PATRÓN EXPANSIVO</small>
                      <strong>ARRECIFE SUPERFICIAL</strong>
                      <p>Múltiples gemas. Movilidad rápida y saltos constantes de atención.</p>
                    </span>
                    <i>{selectedZone === 'reef' ? '✓' : '→'}</i>
                  </button>
                  <button
                    className={`zone-option cave-option ${selectedZone === 'cave' ? 'selected' : ''}`}
                    onClick={() => setSelectedZone('cave')}
                  >
                    <span className="option-letter">B</span>
                    <span>
                      <small>PATRÓN DE CONCENTRACIÓN</small>
                      <strong>CUEVA PROFUNDA</strong>
                      <p>Cofre central. Requiere 8 segundos absolutamente inmóvil.</p>
                    </span>
                    <i>{selectedZone === 'cave' ? '✓' : '→'}</i>
                  </button>
                </div>
                <button className="start-button" onClick={startGame} disabled={!selectedZone}>
                  <span>{selectedZone ? 'SUMERGIR DRON (40s)' : 'ELIGE UNA ZONA'}</span>
                  <i>→</i>
                </button>
                <small>La reserva de 40 segundos inicia de inmediato</small>
              </div>
            </div>
          )}

          {/* MODAL 4: PANTALLA DE RESULTADOS PSICOMÉTRICOS */}
          {phase === 'done' && (
            <div className="briefing-overlay">
              <div className="briefing-card results-card">
                <span className="briefing-index">EVALUACIÓN PSICOMÉTRICA CONCLUIDA</span>
                <p className="briefing-kicker">DIMENSIÓN CONDUCTUAL: EXTROVERSIÓN</p>
                <h1>PUNTUACIÓN <em>{calculatedExtroversion.toFixed(1)}/10.0</em></h1>
                <p style={{ fontSize: '0.85rem', color: '#90a8be', margin: '4px 0 16px 0' }}>
                  {calculatedExtroversion >= 5.0 ? 'Tendencia Extrovertida (Patrón Expansivo)' : 'Tendencia Introvertida (Patrón Focalizado)'}
                </p>

                <div className="result-stats">
                  <div>
                    <span>FREC. MOTRIZ</span>
                    <b>{frecuenciaMotriz}</b>
                    <small style={{ fontSize: '0.65rem', color: '#68849c' }}>clics (x0.08)</small>
                  </div>
                  <div>
                    <span>ÁREA EXPLORADA</span>
                    <b>{explorationPct}%</b>
                    <small style={{ fontSize: '0.65rem', color: '#68849c' }}>{areaExploradaDecimal.toFixed(2)} (x3.0)</small>
                  </div>
                  <div>
                    <span>ESTABILIDAD MÁX.</span>
                    <b>{estabilidadSostenida}s</b>
                    <small style={{ fontSize: '0.65rem', color: '#68849c' }}>inmóvil (-0.35)</small>
                  </div>
                  <div>
                    <span>CRÉDITOS</span>
                    <b>{score}</b>
                    <small style={{ fontSize: '0.65rem', color: '#68849c' }}>recolectados</small>
                  </div>
                </div>

                <div style={{ backgroundColor: '#132130', padding: '12px 16px', borderRadius: '8px', margin: '14px 0', border: '1px solid #20354b', textAlign: 'left' }}>
                  <span style={{ fontSize: '0.68rem', color: '#7ba0be', fontWeight: 'bold' }}>FÓRMULA FACTORIAL APLICADA:</span>
                  <p style={{ fontFamily: 'monospace', fontSize: '0.75rem', color: '#62d2db', margin: '4px 0 0 0' }}>
                    5.0 + ({frecuenciaMotriz} × 0.08) + ({areaExploradaDecimal.toFixed(2)} × 3.0) - ({estabilidadSostenida} × 0.35) = <strong>{calculatedExtroversion}</strong>
                  </p>
                </div>

                <button className="start-button" onClick={chooseAgain}>
                  <span>REPETIR EVALUACIÓN</span>
                  <i>←</i>
                </button>
              </div>
            </div>
          )}
        </div>

        {/* BARRA LATERAL: TELEMETRÍA EN TIEMPO REAL */}
        
      </section>

      <footer>
        <span>OCEANIC BEHAVIORAL LAB · PICTO-PATH AI</span>
        <div><i /> SISTEMA DE TELEMETRÍA ESPACIAL NOMINAL</div>
        <p>SESIÓN #DRN-07-EXTRO</p>
      </footer>
    </main>
  );
}


    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (err) {
      console.error("Error al montar la app:", err);
      document.body.innerHTML += '<div style="color:red;padding:20px;font-family:monospace">Error: ' + err.message + '</div>';
    }
  </script>
</body>
</html>
