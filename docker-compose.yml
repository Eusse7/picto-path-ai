services:
  # -------------------------------------------------------------
  # API Backend (FastAPI)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picto_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - POSTGRES_USER=${POSTGRES_USER:-picto_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-picto_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-picto_path_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./backend:/app
      - ./ai_model/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  # -------------------------------------------------------------
  # Base de Datos Relacional: PostgreSQL (Historial y Usuarios)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: picto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picto_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-picto_path_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picto_user} -d ${POSTGRES_DB:-picto_path_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Base de Datos Vectorial: ChromaDB (Similitud de Estímulos)
  # -------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: picto_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
